[package]
name = "bdd"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
tokio = { version = "1.53.1", features = ["process", "time", "fs", "rt-multi-thread", "macros"] }

[dev-dependencies]
cucumber = { version = "0.23", features = ["output-json"] }
futures = "0.3"
serde_json = "1"

[[test]]
name = "cucumber"
harness = false
