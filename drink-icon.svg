      <rect x="-13.125" y="-36.3125" width="26.25" height="4.8125" transform="rotate(-45 0 -33.90625)" fill="#E5484D"/>
      <rect x="-13.125" y="-24.28125" width="26.25" height="4.8125" transform="rotate(-45 0 -21.875)" fill="#E5484D"/>
      <rect x="-13.125" y="-12.25" width="26.25" height="4.8125" transform="rotate(-45 0 -9.84375)" fill="#E5484D"/>
