[workspace]
members = ["bdd"]
# A standalone probe used only by bench/mtu-recovery.sh, which builds it twice
# against different quinn-proto revisions. Not part of this workspace, so a
# plain `cargo build` never pulls it in.
exclude = ["bench/mtuprobe"]

[package]
name = "straw"
version = "0.1.0"
edition = "2024"
default-run = "straw"

[dependencies]
base64 = "0.23.1"
bytes = "1"
ciborium = "0.2.2"
clap = { version = "4.6.6", features = ["derive"] }
dashmap = "6.2.1"
futures = "0.3.34"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1.5.0"
ipnet = { version = "2.12.1", features = ["serde"] }
noq = { version = "1.2.0", default-features = false, features = ["runtime-tokio", "rustls", "ring", "platform-verifier"] }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log", "platform-verifier"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
ring = "0.17.14"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11"
thiserror = "2"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
tun = { version = "0.8.14", features = ["async"] }

# h3 0.0.8 with upstream's ConnectIp protocol variant backported
# (hyperium/h3 master already has it; drop this vendored patch when the
# next h3 release ships — see UPSTREAM.md for the check).
[patch.crates-io]
h3 = { path = "vendor/h3" }
# quinn-proto 0.11.17's datagram drop loop double-decrements its buffer
# accounting; the first overfull send buffer then underflows the counter and
# every later send_datagram panics ("payload_bytes desynchronized"), killing
# the tunnel under sustained datagram load (found by the Phase D iperf3 UDP
# sweep). Upstream fixed it on the 0.11.x branch (quinn-rs/quinn#2806), which
# also carries the black-hole-detector backport (#2799); neither is in a
# release yet. main is 0.12.0 and cannot be patched in here — quinn 0.11.11
# requires ^0.11, so cargo would silently ignore the patch. Cargo.lock pins the
# exact rev. Drop this when 0.11.18 ships — see UPSTREAM.md for the check.
quinn-proto = { git = "https://github.com/quinn-rs/quinn", branch = "0.11.x" }
